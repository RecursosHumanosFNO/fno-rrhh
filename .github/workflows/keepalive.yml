name: Keep Supabase Alive

# Mantiene despierto el proyecto de Supabase (plan free pausa tras 7 días
# de inactividad). Hace un ping diario al endpoint /api/keepalive.

on:
  schedule:
    # Todos los días a las 12:00 UTC (09:00 hora Argentina)
    - cron: '0 12 * * *'
  workflow_dispatch: {} # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        env:
          # Configurable por si cambia el dominio: la URL estaba hardcodeada.
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          echo "Pinging keepalive endpoint..."
          # -L: portalfno.com hace un redirect 308 (a www, o http->https, según
          # cómo esté configurado el dominio en Vercel) y sin -L el 308 se
          # queda como el código final aunque el sitio ande perfecto.
          response=$(curl -sL -o /dev/null -w "%{http_code}" ${PORTAL_URL:-https://portalfno.com}/api/keepalive)
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            # Antes esto era un ::warning:: y el job quedaba en verde igual, así
            # que un keepalive roto no se distinguía de uno que anda — y el
            # sentido del workflow es justamente que Supabase no se pause.
            echo "::error::Keepalive devolvió $response (esperado 200)"
            exit 1
          fi
