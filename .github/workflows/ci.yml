name: CI

# Verifica que el código compile y pase el linter antes de mergear. Sin esto,
# un error de TypeScript sólo se descubre cuando ya está en producción.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build, lint y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Chequeo de tipos
        # npm run build sólo chequea lo que entra en el grafo de módulos de
        # Next: los tests y cualquier .ts suelto quedaban afuera.
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Vulnerabilidades de dependencias
        # Informativo, no bloquea: la línea 14.x de Next está EOL y arrastra
        # advisories que sólo se cierran migrando a 15/16, así que fallar acá
        # dejaría el CI en rojo permanente sin que nadie pueda hacer nada.
        # Sirve para que un advisory nuevo se vea en el PR y no dentro de un año.
        run: npm audit --audit-level=high || true

      - name: Build
        # Las claves NEXT_PUBLIC_ se leen en tiempo de build. Son valores de
        # relleno: acá sólo nos interesa que compile, no conectarse a Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
