name: Daily Database Backup

# Hace un backup completo de la base de datos Supabase todos los días.
# Los archivos quedan disponibles para descargar desde la pestaña Actions
# de GitHub durante 90 días.

on:
  schedule:
    # 03:00 UTC = 00:00 Argentina (UTC-3)
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # Permite ejecutarlo manualmente en cualquier momento

jobs:
  backup:
    name: Exportar base de datos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar backup
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-db.js

      - name: Obtener fecha actual
        id: fecha
        run: echo "hoy=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Guardar backup como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: backup-fno-${{ steps.fecha.outputs.hoy }}
          path: backup/
          retention-days: 90    # Se conservan 90 días (~3 meses de historial)
          if-no-files-found: error

      # Sin esto, un backup que revienta sólo deja una cruz roja en la pestaña
      # Actions que nadie mira, y la falla se descubre el día que hace falta
      # restaurar. El mail sale por la misma cuenta que usa el portal.
      - name: Avisar por mail si el backup falló
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Sin CRON_SECRET no se puede avisar del fallo"
            exit 0
          fi
          curl -sS -X POST "${PORTAL_URL:-https://portalfno.com}/api/notify" \
            -H "Content-Type: application/json" \
            -H "x-internal-key: $CRON_SECRET" \
            -d "{\"type\":\"alerta_sistema\",\"data\":{\"trabajo\":\"Backup diario de la base\",\"url\":\"$RUN_URL\"}}"
